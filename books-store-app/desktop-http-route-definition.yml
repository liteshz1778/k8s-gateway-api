apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: desktop-http-route
spec:
  parentRefs:
    - name: envoy-gateway
  hostnames:
    - "www.mybookstore.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: desktop-users-svc
          port: 80
          #weight: 5
      matches:
        - path:
            type: PathPrefix
            value: /
