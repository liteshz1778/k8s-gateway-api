apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  labels:
    app: backend-v2
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: backend-v2
  template:
    metadata:
      name: backend-v2-pod
      labels:
        app: backend-v2
    spec:
      containers:
        - name: backend-v2-container
          image: gcr.io/k8s-staging-gateway-api/echo-basic:v20231214-v1.0.0-140-gf544a46e
          ports:
            - containerPort: 3000
          env: 
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

---

apiVersion: v1
kind: Service
metadata:
  name: backend-v2-svc
spec:
  type: ClusterIP
  selector: 
    app: backend-v2
  ports:
    - port: 3000
      targetPort: 3000

